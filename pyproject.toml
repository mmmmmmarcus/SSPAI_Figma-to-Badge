[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "figma-badge-3d"
version = "0.3.0"
description = "Headless Figma badge workflow and recipe-driven GLB/USDZ exporter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["Pillow>=10,<13"]

[project.scripts]
badgegen = "badgegen.cli:main"

[tool.setuptools.packages.find]
include = ["badgegen*"]
